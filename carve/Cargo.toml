[package]
name = "spinny-carve"
version = "0.1.0"
edition = "2021"
description = "Three axis toolpaths from a triangle mesh for the spinny CAM profiles: z-level roughing, waterline and parallel finishing"
publish = false

[lib]
name = "carve"
path = "src/lib.rs"

[[bin]]
name = "spinny-carve"
path = "src/main.rs"

[dependencies]
clipper2-rust = "1.2"
rayon = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The CAM runs the kernel from a debug build; without optimization the
# slicing and the drop cutter are tens of times slower.
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
