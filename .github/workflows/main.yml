name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout spinny-cnc
        uses: actions/checkout@v4
    
      - name: Checkout kicad-to-gcode
        uses: actions/checkout@v4
        with:
          repository: tmpk13/kicad-to-gcode
          path: ../kicad-to-gcode
    
      - uses: jdx/mise-action@v5
    
      - name: Run release
        run: mise run release
