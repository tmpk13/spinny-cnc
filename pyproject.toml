# Workspace root: one environment and one lock file for the two Python
# packages, the toolpath library with its command line tools and the web
# backend. Run anything with `uv run` from here, or use the mise tasks.

[tool.uv.workspace]
members = ["toolpath", "web/backend"]

[tool.uv.sources]
spinny-laser = { workspace = true }
spinny-web = { workspace = true }
laser-sweep = { path = "../kicad-to-gcode", editable = true }

[tool.uv]
python-preference = "system"

[dependency-groups]
dev = [
    # The backend with the parts a plain install leaves out, so a checkout
    # runs the Auto tab and spinny-mcp and tests them.
    "spinny-web[auto,mcp]",
    "pytest>=8",
    "pytest-timeout",
    "httpx",
]

[tool.pytest.ini_options]
# Both suites from the root. importlib mode keeps the two suites' same-named
# test files apart; each suite's conftest puts its helpers on the path.
testpaths = ["toolpath/tests", "web/backend/tests"]
addopts = "--import-mode=importlib"
timeout = 30
markers = [
    "e2e: runs against a virtual firmware binary named by SPINNY_VIRTUAL",
]
