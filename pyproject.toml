[project]
name = "spinny-laser"
version = "0.1.0"
description = "Isolation gcode for a laser on a linear X axis over a PCB on a rotary table"
requires-python = ">=3.11"
dependencies = ["laser-sweep"]

[project.scripts]
spinny-iso = "spinny_laser.cli:main"
spinny-polar = "spinny_laser.convert:main"

[tool.uv.sources]
laser-sweep = { path = "../kicad-to-gcode", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spinny_laser"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
