[project]
name = "spinny-web"
version = "0.1.0"
description = "Web backend for the rotary table laser: serial link, joint-space streaming, job import"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pyserial",
    "python-multipart",
    "websockets",
    "svgelements",
    "pydantic",
    "spinny-laser",
    "laser-sweep",
    "httpx",
    "jsonschema",
]

# Parts a plain install leaves out. The 2.x APIs: the low-level MCP server
# and the Messages SDK as used.
[project.optional-dependencies]
# The Auto tab's Anthropic provider.
auto = ["anthropic>=2"]
# spinny-mcp, and the Auto tab's Claude Code provider, which runs it.
mcp = ["mcp>=2"]

[project.scripts]
spinny-web = "spinny_web.app:main"
spinny-bridge = "spinny_web.bridge:main"
spinny-mcp = "spinny_web.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spinny_web"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 30
markers = [
    "e2e: runs against a virtual firmware binary named by SPINNY_VIRTUAL",
]
