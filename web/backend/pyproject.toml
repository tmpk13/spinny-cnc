[project]
name = "spinny-web"
version = "0.1.0"
description = "Web backend for the rotary table laser: serial link, joint-space streaming, job import"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pyserial",
    "python-multipart",
    "websockets",
    "svgelements",
    "pydantic",
    "spinny-laser",
    "laser-sweep",
]

[project.scripts]
spinny-web = "spinny_web.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spinny_web"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 30
markers = [
    "e2e: runs against a virtual firmware binary named by SPINNY_VIRTUAL",
]
