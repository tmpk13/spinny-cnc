<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Spinny Laser</title>
    <!-- A beam over the rotation axis, inline so the page asks for no icon file. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23888' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23e5484d'/%3E%3Cpath d='M16 16 L31 16' stroke='%23e5484d' stroke-width='2'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="./src/style.css">
</head>
<body>
    <div id="app">
        <header id="status" class="statusbar"></header>
        <nav id="tabs" class="tabs" aria-label="Pages"></nav>
        <!-- Two sides (src/sides.ts): the Use side's pages in one pane, the
             Setup side's in the other; one shows at a time, or both side by
             side with the handle between them. -->
        <div id="pane-use" class="pane" data-side="use">
        <!-- The Use side's areas (src/views/tabs.ts): Home, Job and Run. -->
        <main id="page-home" class="grid overview-grid page">
            <div class="column">
                <section id="overview" class="panel" aria-label="Home"></section>
            </div>
        </main>
        <main id="page-job" class="grid page">
            <div class="column">
                <section id="jobs" class="panel" aria-label="Jobs"></section>
                <section id="job" class="panel" aria-label="Job"></section>
            </div>
            <div class="column">
                <section id="preview" class="panel preview-panel" aria-label="Preview"></section>
                <section id="jobjson" class="panel" aria-label="Job JSON"></section>
            </div>
            <div class="column">
                <section id="mill-operation" class="panel" aria-label="Draw"></section>
                <section id="job-machine" class="panel machine" aria-label="Machine"></section>
                <section id="auto-chat" class="panel auto-chat" aria-label="Assistant"></section>
                <section id="auto-about" class="panel" data-stack aria-label="What it can do"></section>
            </div>
        </main>
        <main id="page-run" class="grid page">
            <div class="column">
                <section id="machine" class="panel machine" aria-label="Machine"></section>
            </div>
            <div class="column">
                <section id="steps" class="panel" aria-label="Steps"></section>
                <section id="camera-view" class="panel" aria-label="Camera view"></section>
                <section id="pnp-view" class="panel" aria-label="Bottom camera view"></section>
                <section id="pnp-top-view" class="panel hidden" aria-label="Top camera view"></section>
                <section id="place" class="panel" aria-label="Board place"></section>
                <section id="console" class="panel console" aria-label="Console"></section>
            </div>
            <div class="column">
                <section id="pnp-parts" class="panel" aria-label="Parts"></section>
                <section id="pnp-board" class="panel" aria-label="Board"></section>
                <section id="heightmap" class="panel" aria-label="Height"></section>
                <section id="pnp-feeders" class="panel hidden" aria-label="Feeders"></section>
                <section id="run" class="panel" data-dock aria-label="Run"></section>
            </div>
        </main>
        </div>
        <div id="pane-divider" class="pane-divider" role="separator" aria-orientation="vertical" aria-label="Use and Setup widths" tabindex="0"></div>
        <div id="pane-setup" class="pane" data-side="setup">
        <main id="page-facts" class="grid facts-grid page">
            <div class="column">
                <section id="facts" class="panel" aria-label="Checklist"></section>
            </div>
            <div class="column">
                <section id="tests" class="panel" aria-label="Tests"></section>
            </div>
        </main>
        <main id="page-machines" class="grid config-grid page">
            <div class="column">
                <section id="connection" class="panel" aria-label="Connection"></section>
                <section id="machine-file" class="panel" aria-label="Machine file"></section>
                <section id="openpnp-import" class="panel" aria-label="Import from OpenPnP"></section>
            </div>
            <div class="column">
                <section id="settings" class="panel" aria-label="Settings"></section>
            </div>
        </main>
        <!-- Each camera's settings, calibration and routines; a pick and
             place machine's head and bed. Their pictures are on Run. -->
        <main id="page-cameras" class="grid page">
            <div class="column">
                <section id="camera" class="panel" aria-label="Camera"></section>
                <section id="camera-controls" class="panel" data-stack aria-label="Picture controls"></section>
                <section id="camera-sight" class="panel" data-stack aria-label="Lens and colors"></section>
                <section id="camera-changes" class="panel" data-stack aria-label="Camera changes"></section>
                <section id="pnp-nozzle" class="panel" aria-label="Nozzle"></section>
            </div>
            <div class="column">
                <section id="pnp-camera" class="panel" aria-label="Bottom camera"></section>
                <section id="pnp-camera-controls" class="panel" data-stack aria-label="Bottom picture controls"></section>
                <section id="pnp-camera-sight" class="panel" data-stack aria-label="Bottom lens and colors"></section>
                <section id="pnp-camera-changes" class="panel" data-stack aria-label="Bottom camera changes"></section>
                <section id="pnp-top" class="panel hidden" aria-label="Top camera"></section>
                <section id="pnp-top-controls" class="panel hidden" data-stack aria-label="Top picture controls"></section>
                <section id="pnp-top-sight" class="panel hidden" data-stack aria-label="Top lens and colors"></section>
                <section id="pnp-top-changes" class="panel hidden" data-stack aria-label="Top camera changes"></section>
            </div>
            <div class="column">
                <section id="pnp-head" class="panel hidden" aria-label="Head"></section>
                <section id="pnp-machine-view" class="panel hidden" aria-label="Machine view"></section>
            </div>
        </main>
        <main id="page-cam" class="grid cam-grid page">
            <div class="column">
                <section id="cam" class="panel" aria-label="CAM"></section>
            </div>
            <div class="column">
                <section id="cam-file" class="panel" aria-label="Profile file"></section>
            </div>
        </main>
        <main id="page-ui" class="grid config-grid page">
            <div class="column">
                <section id="version" class="panel" aria-label="Version"></section>
                <section id="reports" class="panel" aria-label="Bug reports"></section>
            </div>
            <div class="column">
                <section id="plugins" class="panel" aria-label="Plugins"></section>
            </div>
        </main>
        </div>
        <div id="toasts" class="toasts" aria-live="polite"></div>
    </div>
    <script type="module" src="./src/main.ts"></script>
</body>
</html>
