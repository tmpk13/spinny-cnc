<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Spinny Laser</title>
    <!-- A beam over the rotation axis, inline so the page asks for no icon file. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23888' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23e5484d'/%3E%3Cpath d='M16 16 L31 16' stroke='%23e5484d' stroke-width='2'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="./src/style.css">
</head>
<body>
    <div id="app">
        <header id="status" class="statusbar"></header>
        <nav id="tabs" class="tabs" aria-label="Pages"></nav>
        <main id="page-jobs" class="grid page">
            <div class="column">
                <section id="dro" class="panel dro" aria-label="Position"></section>
                <section id="jog" class="panel" aria-label="Jog"></section>
                <section id="laser" class="panel" aria-label="Laser"></section>
                <section id="markers" class="panel" aria-label="Markers"></section>
            </div>
            <div class="column">
                <section id="steps" class="panel" aria-label="Setup steps"></section>
                <section id="preview" class="panel preview-panel" aria-label="Preview"></section>
                <section id="jobjson" class="panel" aria-label="Job JSON"></section>
                <section id="camera-view" class="panel" aria-label="Camera view"></section>
                <section id="camera" class="panel" aria-label="Camera"></section>
                <section id="console" class="panel console" aria-label="Console"></section>
            </div>
            <div class="column">
                <section id="jobs" class="panel" aria-label="Jobs"></section>
                <section id="heightmap" class="panel" aria-label="Height map"></section>
                <section id="align" class="panel" aria-label="Align"></section>
                <section id="run" class="panel" data-dock aria-label="Run"></section>
            </div>
        </main>
        <main id="page-plot" class="grid page">
            <div class="column">
                <section id="mill-dro" class="panel dro" aria-label="Position"></section>
                <section id="mill-jog" class="panel" aria-label="Jog"></section>
                <section id="mill-spindle" class="panel" aria-label="Spindle"></section>
            </div>
            <div class="column">
                <section id="mill-preview" class="panel preview-panel" aria-label="Preview"></section>
                <section id="mill-run" class="panel" aria-label="Run"></section>
            </div>
            <div class="column">
                <section id="mill-operation" class="panel" aria-label="Operation"></section>
                <section id="mill-markers" class="panel" aria-label="Markers"></section>
            </div>
        </main>
        <main id="page-cam" class="grid cam-grid page">
            <div class="column">
                <section id="cam" class="panel" aria-label="CAM"></section>
            </div>
            <div class="column">
                <section id="cam-preview" class="panel preview-panel" aria-label="CAM preview"></section>
                <section id="cam-file" class="panel" aria-label="Profile file"></section>
            </div>
        </main>
        <main id="page-pnp" class="grid page">
            <div class="column">
                <section id="pnp-parts" class="panel" aria-label="Parts"></section>
                <section id="pnp-jog" class="panel" aria-label="PNP jog"></section>
            </div>
            <div class="column">
                <section id="pnp-board" class="panel" aria-label="Board"></section>
                <section id="pnp-view" class="panel" aria-label="Bottom camera view"></section>
                <section id="pnp-top-view" class="panel hidden" aria-label="Top camera view"></section>
                <section id="pnp-camera" class="panel" aria-label="Bottom camera"></section>
                <section id="pnp-top" class="panel hidden" aria-label="Top camera"></section>
            </div>
            <div class="column">
                <section id="pnp-steps" class="panel" aria-label="PNP steps"></section>
                <section id="pnp-head" class="panel hidden" aria-label="Head"></section>
                <section id="pnp-refs" class="panel hidden" aria-label="Board on the machine"></section>
                <section id="pnp-feeders" class="panel hidden" aria-label="Feeders"></section>
                <section id="pnp-run" class="panel hidden" aria-label="Placing"></section>
                <section id="pnp-nozzle" class="panel" aria-label="Nozzle"></section>
            </div>
        </main>
        <main id="page-auto" class="grid auto-grid page">
            <div class="column">
                <section id="auto-chat" class="panel auto-chat" aria-label="Auto"></section>
            </div>
            <div class="column">
                <section id="auto-about" class="panel" aria-label="What it can do"></section>
            </div>
        </main>
        <main id="page-config" class="grid config-grid page">
            <div class="column">
                <section id="machine-file" class="panel" aria-label="Machine file"></section>
                <section id="openpnp-import" class="panel" aria-label="Import from OpenPnP"></section>
                <section id="version" class="panel" aria-label="Version"></section>
            </div>
            <div class="column">
                <section id="settings" class="panel" aria-label="Settings"></section>
            </div>
        </main>
        <main id="page-connection" class="grid connection-grid page">
            <div class="column">
                <section id="connection" class="panel" aria-label="Connection"></section>
            </div>
        </main>
        <div id="toasts" class="toasts" aria-live="polite"></div>
    </div>
    <script type="module" src="./src/main.ts"></script>
</body>
</html>
