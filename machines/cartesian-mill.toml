# The X/Y machine milling with a spindle on the laser output and the
# focus axis as its depth. The host keeps the travel clearance over the
# surface and the spin-up dwell.

name = "Cartesian mill"
description = "X/Y machine with a spindle on the output and the focus axis as depth"
kinematics = "cartesian"
tool = "spindle"

# Wired as a three axis mill: the rail on the X socket, the slide on Y
# and the depth on Z. Nothing drives the table here, so it sits on the E
# socket with its driver left alone.
[rail]
socket = "X"
steps_per_mm = 12800        # 200 steps, 256 microsteps, 4 mm per turn; the step generator caps it near 470 mm/min
limit = 60

[table]
socket = "E"
current_ma = 0

[slide]
socket = "Y"
steps_per_mm = 12800        # 200 steps, 256 microsteps, 4 mm per turn
max_rate = 560
accel = 50
jerk = 3
jog_rate = 120
limit = 40

[focus]
socket = "Z"
fitted = true
steps_per_mm = 10240        # 200 steps, 256 microsteps, 5 mm per turn
max_rate = 600
accel = 50
jerk = 1
jog_rate = 120
current_ma = 600

[probe]
invert = true
brake_ms = 1

[host]
tolerance = 0.005
clearance = 2.0             # mm over the surface for travel between cuts
spinup = 2.0                # s of dwell after the spindle starts or changes speed

# The page's controls, as a three axis mill: the rail, the cross slide
# and the depth axis as X, Y and Z, each with its own zero, on the arrow
# keys and Page Down/Up. The board pad would move the same two joints as
# X and Y, so it is left out, and with it the board row of the readout.
# The table has no driver here, so it has no bar. polar-laser.toml says
# what each key means.
[controls]
pad = false
feed = true
center = {}

[[controls.axes]]
axis = "r"
letter = "X"
label = "X (rail)"
steps = [0.1, 1, 10]
step = 1
buttons = ["X-", "X+"]
feed = true
goto = true
zero = true
zero_hint = "X is measured from here: put the tool over the job's X origin first."
keys = ["ArrowLeft", "ArrowRight"]

[[controls.axes]]
axis = "z"
letter = "Y"
label = "Y (cross slide)"
steps = [0.1, 1, 10]
step = 1
buttons = ["Y-", "Y+"]
feed = true
goto = true
zero = true
zero_hint = "Y is measured from here: put the tool over the job's Y origin first."
keys = ["ArrowDown", "ArrowUp"]

[[controls.axes]]
axis = "h"
letter = "Z"
label = "Z (depth)"
steps = [0.05, 0.1, 1]
step = 0.1
buttons = ["Down", "Up"]
feed = false
goto = false
zero = true
zero_hint = "Touch the tool to the copper first: a milled cut without a height map goes down from Z 0. A height map probed before keeps its heights in the old numbers, so a run follows it only after a new Z 0 here (probe again for another board)."
keys = ["PageDown", "PageUp"]
note = "Raises and lowers the tool; up is positive, Z 0 is the board's surface"
