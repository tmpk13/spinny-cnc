# The polar laser: the head on the rail over the rotation axis, the board
# on the harmonic drive table. Every value here is the firmware's default,
# so this file is the machine as it boots; edit it to describe yours. What
# a file leaves out stays at the firmware's default.

name = "Polar laser"
description = "UV laser on the rail, the board turning under it on the table"
kinematics = "polar"
tool = "laser"

[rail]                      # R: the radius, mm
steps_per_mm = 10240        # 200 steps, 256 microsteps, 5 mm per turn
max_rate = 560              # mm/min; the step generator runs out before the motor does
accel = 50                  # mm/s^2
jerk = 3                    # mm/s allowed at a corner
jog_rate = 300              # mm/min for a jog without F
limit = 0                   # soft limit either side of the axis, mm; 0 is none
invert = false
current_ma = 800
microsteps = 256
socket = "X"                # driver socket: X, Y, Z or E, each used once

[table]                     # A: the table, degrees
steps_per_deg = 14222.222   # 200 steps, 256 microsteps, 100:1
max_rate = 400              # deg/min
accel = 50                  # deg/s^2
jerk = 2                    # deg/s allowed at a corner
jog_rate = 200
invert = false
current_ma = 800
microsteps = 256
socket = "Y"

[slide]                     # Z: the cross slide, mm; a setup axis here
steps_per_mm = 10240
max_rate = 560
accel = 50
jerk = 3
jog_rate = 120
limit = 0
invert = false
current_ma = 800
microsteps = 256
socket = "Z"

[focus]                     # H: the focus axis, mm; not fitted here
fitted = false
steps_per_mm = 6400         # 200 steps, 256 microsteps, 8 mm per turn
max_rate = 600
accel = 50
jerk = 1
jog_rate = 120
invert = false
current_ma = 600
microsteps = 256
socket = "E"

[probe]
invert = false              # true: the probe input is active high
brake_ms = 20               # motion queued during a probe, 0 to 160

[output]                    # the laser PWM
pwm_hz = 5000
s_max = 1000                # S for full duty
s_min = 0                   # dyn mode: below this the beam is off
invert = false              # true: active low output
test_ms = 5000              # default T for a manual beam

[drivers]
enable_invert = false
idle_ms = 0                 # motors off after this long idle; 0 is never
step_us = 2
hold_pct = 50
stealth = true

[host]
tolerance = 0.005           # chord tolerance of the streamed path, mm

# The page's controls: what the jog panel and the readout draw for this
# machine. Left out, they are drawn from the kinematics, the tool and the
# focus axis, which is what is spelled out here. Every joint shown is one
# [[controls.axes]] entry, in the order drawn; a key an entry leaves out is
# the default for that joint.
[controls]
pad = true                  # a board X/Y pad, on the arrow keys when no field has the focus
pad_steps = [0.1, 1, 10]    # mm; an axis without steps of its own uses the pad's step
pad_step = 1                # the step picked at the start
feed = true                 # a feed field, mm/min, for the pad and the axes that take it; blank is the firmware's jog rate
center = { r = 0 }          # where Center sends the joints: the rail over the rotation axis; left out, no button

[[controls.axes]]
axis = "r"                  # the firmware's joint: r, a, z or h
letter = "R"                # in the readout, and in "Set R=0 here"
label = "Radius"
# steps left out: the pad's step
buttons = ["Radius -", "Radius +"]
place = "buttons"           # beside the pad; "frame" is a block of its own with its note and steps
feed = true                 # the feed field applies; false runs at the firmware's jog rate for the axis
goto = true                 # a field in the joint goto row
zero = true                 # a "Set R=0 here" button, which asks with the hint
zero_hint = "The beam must be over the rotation axis."
keys = []                   # two key names for minus and plus, such as ["PageDown", "PageUp"]

[[controls.axes]]
axis = "a"
letter = "A"
label = "Table"
steps = [1, 10, 90]         # degrees
step = 10
buttons = ["Turn -", "Turn +"]
place = "buttons"
feed = true
goto = true
zero = true
zero_hint = ""

[[controls.axes]]
axis = "z"
letter = "Z"
label = "Cross slide"
steps = [0.05, 0.1, 0.5]    # the small corrections a centering burn is read into
step = 0.1
buttons = ["Z-", "Z+"]
place = "frame"
feed = false                # a setup axis: the firmware's own jog rate
goto = false
zero = true
zero_hint = "The rail is over the axis when the centering lines meet at a point."
note = "Setup only: carries the rail across the rotation axis"
