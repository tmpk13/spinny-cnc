<text x="680" y="51" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#073642">Machine and Stop</text>
<text x="680" y="70" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#586e75">Which machine, what it is doing, and Stop:</text>
<text x="680" y="87" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#586e75">the same on every screen.</text>
<circle cx="660" cy="116.1" r="11.5" fill="#d33682" stroke="#ffffff" stroke-width="2"/>
<text x="660" y="120.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="680" y="121.1" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#073642">Areas</text>
<text x="680" y="140.1" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#586e75">Home, Job, Run, Machines: where you are,</text>
<text x="680" y="157.1" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#586e75">and nothing else.</text>
<circle cx="660" cy="186.2" r="11.5" fill="#d33682" stroke="#ffffff" stroke-width="2"/>
<text x="660" y="190.6" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="680" y="191.2" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#073642">Steps</text>
<text x="680" y="210.2" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#586e75">The steps of this machine's work, from its</text>
<text x="680" y="227.2" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#586e75">machine file: done, now, next.</text>
<circle cx="660" cy="256.2" r="11.5" fill="#d33682" stroke="#ffffff" stroke-width="2"/>
<text x="660" y="260.6" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="680" y="261.2" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#073642">The work</text>
<text x="680" y="280.2" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#586e75">The preview or the camera's picture, as</text>
<text x="680" y="297.3" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#586e75">large as the screen allows.</text>
<circle cx="660" cy="326.3" r="11.5" fill="#d33682" stroke="#ffffff" stroke-width="2"/>
<text x="660" y="330.7" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
<text x="680" y="331.3" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#073642">This step</text>
<text x="680" y="350.3" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#586e75">The step's few controls and its one next</text>
<text x="680" y="367.4" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#586e75">action; More holds the rest.</text>
<circle cx="660" cy="396.4" r="11.5" fill="#d33682" stroke="#ffffff" stroke-width="2"/>
<text x="660" y="400.8" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
<text x="680" y="401.4" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#073642">Dock</text>
<text x="680" y="420.4" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#586e75">Position, jog and the quick bar: one set of</text>
<text x="680" y="437.4" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#586e75">machine controls everywhere.</text>
