<svg xmlns="http://www.w3.org/2000/svg" width="960" height="502" viewBox="0 0 960 502" role="img" aria-label="Three layers of controls, sorted by how often they are used, all reachable by search">
<title>Three layers of controls, sorted by how often they are used, all reachable by search</title>
