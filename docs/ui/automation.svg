<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="420" viewBox="0 0 1020 420" role="img" aria-label="A value's way from asked for to automatic: missing, set by hand, measured by a routine, kept checked; the Checklist turns from a form into a health board">
<title>A value's way from asked for to automatic: missing, set by hand, measured by a routine, kept checked; the Checklist turns from a form into a health board</title>
