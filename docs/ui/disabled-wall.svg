<text x="534" y="318" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#073642" letter-spacing="1.1">FIND BOARD</text>
<circle cx="548" cy="360" r="11" fill="#859900"/>
