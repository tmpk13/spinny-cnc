<text x="534" y="108" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#073642" letter-spacing="1.1">FIND BOARD</text>
<rect x="540.5" y="148.5" width="27" height="18" rx="2.5" fill="none" stroke="#586e75" stroke-width="1.7"/>
<circle cx="554" cy="157.5" r="5.2" fill="none" stroke="#586e75" stroke-width="1.7"/>
<path d="M548.75,148.5 L551.75,144.0 H556.25 L559.25,148.5" fill="none" stroke="#586e75" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
