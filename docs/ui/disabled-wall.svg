<text x="30" y="626" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#586e75">Nine locked buttons, a chart with nothing in it and a paragraph; the one</text>
<text x="30" y="643.8" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#586e75">thing to do is in another panel.</text>
