<text x="725" y="209.9" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#ffffff" text-anchor="middle">Start the camera</text>
<circle cx="912" cy="205" r="11.5" fill="#d33682" stroke="#ffffff" stroke-width="2"/>
<text x="912" y="209.4" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="520" y="284" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#586e75">A moment later: the board is found</text>
