<text x="864" y="423.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#073642" text-anchor="middle">Look again</text>
<line x1="536" y1="450" x2="914" y2="450" stroke="#dcd5bf" stroke-width="1" stroke-linecap="round"/>
<path d="M537.0,466.0 L541.0,470.0 L537.0,474.0" fill="none" stroke="#586e75" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="549" y="474" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#586e75">More: method, threshold, full scan, corners by hand</text>
<circle cx="912" cy="364" r="11.5" fill="#d33682" stroke="#ffffff" stroke-width="2"/>
<text x="912" y="368.4" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<circle cx="912" cy="470" r="11.5" fill="#d33682" stroke="#ffffff" stroke-width="2"/>
<text x="912" y="474.4" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="520" y="528" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#586e75">The step shows the action that unlocks it, then its result and the</text>
<text x="520" y="545.8" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#586e75">action the result allows. Nothing locked is shown.</text>
