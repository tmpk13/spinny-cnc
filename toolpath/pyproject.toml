[project]
name = "spinny-laser"
version = "0.1.0"
description = "Toolpaths for the spinny laser and mill: polar kinematics, copper clearing and deposition, stencils, centering coupons, machine files, CAM profiles and their gcode"
requires-python = ">=3.12"
# clear.py offsets with pyclipper itself; laser-sweep also depends on it.
dependencies = ["laser-sweep", "pyclipper>=1.3"]

[project.scripts]
spinny-iso = "spinny_laser.cli:main"
spinny-polar = "spinny_laser.convert:main"
spinny-jog = "spinny_laser.jog:main"
spinny-center = "spinny_laser.center:main"
spinny-cam = "spinny_laser.camcli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spinny_laser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
