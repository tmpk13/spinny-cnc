[project]
name = "spinny-laser"
version = "0.1.0"
description = "Toolpaths for a laser on a linear axis over a PCB on a rotary table: polar kinematics, copper clearing and deposition, centering patterns, and gcode for a grblHAL controller"
requires-python = ">=3.12"
dependencies = ["laser-sweep"]

[project.scripts]
spinny-iso = "spinny_laser.cli:main"
spinny-polar = "spinny_laser.convert:main"
spinny-jog = "spinny_laser.jog:main"
spinny-center = "spinny_laser.center:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spinny_laser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
