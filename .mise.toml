[tools]
python = "3.12"
uv = "latest"

[tasks.web]
description = "Build the page and serve it with the backend on port 8000"
run = """
(cd web/frontend && bun install --silent && bun run --silent build)
uv run spinny-web
"""

[tasks.dev]
description = "The page from the dev server with live reload; point it at a backend with ?api=http://localhost:8000"
run = "cd web/frontend && bun run dev"

[tasks.virtual]
description = "Virtual firmware on socket://127.0.0.1:2323 as the polar laser"
run = "cd firmware && cargo run -q -p spinny-virtual -- --listen 127.0.0.1:2323 --machine ../machines/polar-laser.toml"

[tasks.virtual-mill]
description = "Virtual firmware on socket://127.0.0.1:2323 as the cartesian spindle machine over a tilted board"
run = "cd firmware && cargo run -q -p spinny-virtual -- --listen 127.0.0.1:2323 --machine ../machines/cartesian-mill.toml --surface -1.5,0.01,-0.02"

[tasks.flash]
description = "Build the board firmware and copy it to an SKR Pico held in BOOTSEL mode"
run = "cd firmware/rp2040 && cargo run --release"

[tasks.build-virtual]
description = "Build the virtual firmware the end to end tests run against"
run = "cd firmware && cargo build -q -p spinny-virtual"

[tasks.test-firmware]
description = "Firmware crates"
run = "cd firmware && cargo test -q"

[tasks.test-toolpath]
description = "Toolpath library and command line tools"
run = "uv run pytest -q toolpath/tests"

[tasks.test-backend]
description = "Web backend, with the end to end runs on the virtual firmware"
depends = ["build-virtual"]
run = "SPINNY_VIRTUAL=firmware/target/debug/spinny-virtual uv run pytest -q web/backend/tests"

[tasks.test-frontend]
description = "Page: type check and tests"
run = "cd web/frontend && bun run --silent check && bun test"

[tasks.test-sim]
description = "Gcode simulator"
run = "cd sim && cargo test -q"

[tasks.test]
description = "Every suite"
depends = ["test-firmware", "test-toolpath", "test-backend", "test-frontend", "test-sim"]
